[tasks.test]
description = "Run unit tests"
run = "uv run -q --no-project --python-preference only-system --with pytest --with pillow --with segno pytest -q --tb=short tests"

[tasks.print]
description = "Print text or an image: mise run print -- 'Hello' | -- -i logo.png"
run = "uv run -q tprint.py"

[tasks.print-bt]
description = "Print over Bluetooth, finding the printer automatically: mise r print-bt -- 'Hello'"
run = """
find() { bluetoothctl devices | grep -m1 -oE '([0-9A-F]{2}:){5}[0-9A-F]{2} T0[0-9]' | cut -d' ' -f1; }
addr=$(find)
[ -n "$addr" ] || { bluetoothctl --timeout 10 scan on >/dev/null 2>&1; addr=$(find); }
[ -n "$addr" ] || { echo "printer not found over Bluetooth; is it on?" >&2; exit 1; }
TPRINT_BT=$addr uv run -q tprint.py
"""

[tasks.status]
description = "Show printer and label status"
run = "uv run -q tprint.py --status"

[tasks.scan]
description = "Scan for the printer over Bluetooth (name starts with T0)"
# Scan silently: bluetoothctl prints only devices new to it, and 5.72 can segfault on exit.
run = """
bluetoothctl --timeout 10 scan on >/dev/null 2>&1 || true
bluetoothctl devices | grep -E ' T0[0-9]' || { echo "printer not found; is it on?" >&2; exit 1; }
"""

[tasks.udev]
description = "Install the udev rule granting user access to the printer (sudo)"
run = "sudo install -m 644 70-supvan.rules /etc/udev/rules.d/ && sudo udevadm control --reload && sudo udevadm trigger"
