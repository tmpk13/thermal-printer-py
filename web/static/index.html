<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Designer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Label Designer</h1>
    <button id="printer" class="chip" title="Check the printer again">Checking printer...</button>
    <span class="grow"></span>
    <label class="inline">Density <select id="density"></select></label>
    <button id="print-one">Print label</button>
    <button id="print-batch" class="primary">Print batch (<span id="total"></span>)</button>
    <button id="cancel" class="danger" hidden>Cancel</button>
    <button id="theme"></button>
</header>
<p id="message" role="status"></p>
<main>
    <aside class="panel batch-panel">
        <h2>Batch</h2>
        <ol id="batch"></ol>
        <div class="row">
            <button id="new-label">New label</button>
            <button id="export" title="Save the batch as a JSON file">Export</button>
            <button id="import" title="Load a batch JSON file">Import</button>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
    </aside>

    <section class="panel editor">
        <div class="row toolbar">
            <button id="add-text">+ Text</button>
            <button id="add-qr">+ QR</button>
            <button id="add-image">+ Image</button>
            <button id="add-rect">+ Box</button>
            <input id="image-file" type="file" accept="image/*" hidden>
        </div>
        <div class="row label-form">
            <label class="inline">Name <input id="label-name" size="12"></label>
            <label class="inline" title="Across the print head, at most 48 mm">Width mm
                <input id="label-w" type="number" min="1" max="48" step="1"></label>
            <label class="inline" title="Along the paper feed">Length mm
                <input id="label-h" type="number" min="1" step="1"></label>
            <label class="inline" title="Lay content along the feed"><input id="label-rotate" type="checkbox"> Rotate</label>
            <button id="use-printer" title="Size of the label loaded in the printer">Printer size</button>
        </div>
        <div class="stage-wrap">
            <div id="stage">
                <canvas id="view"></canvas>
                <div id="overlay"></div>
            </div>
        </div>
        <p class="hint"><span id="dims"></span>. Drag to move, corners to resize (snaps to 0.5 mm,
            hold Alt for 1 dot). Arrows nudge, Shift+arrows by 1 dot, Delete removes, Ctrl+D duplicates,
            R / Shift+R turns text.</p>
    </section>

    <aside class="panel side">
        <section id="props"></section>
        <section class="unicode">
            <h2>Characters</h2>
            <div id="most-used" class="glyphs" aria-label="Most used characters"></div>
            <input id="uni-search" type="search" placeholder="Loading character names..."
                   aria-label="Search Unicode characters">
            <div id="uni-results" class="glyphs results"></div>
            <p id="uni-name" class="hint"></p>
        </section>
    </aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
